<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberFlow - Agendamentos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        /* Forçando a fonte Courier New / Monospace em toda a aplicação */
        body, button, input, select, textarea {
            font-family: 'Courier New', Courier, monospace !important;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <!-- Header -->
    <header class="bg-black border-b border-amber-500/30 p-4 text-center shadow-lg">
        <h1 class="text-xl font-bold text-amber-400 tracking-wider">💈 BARBERFLOW</h1>
        <p class="text-xs text-amber-200/60 uppercase tracking-widest mt-1">Gestão de Horários • 1 Vaga por Horário</p>
    </header>

    <!-- Navegação por Abas -->
    <nav class="flex border-b border-amber-500/30 bg-neutral-950">
        <button onclick="mudarAba('cliente')" id="btn-cliente" class="flex-1 py-3 text-center font-bold text-amber-400 border-b-2 border-amber-400 transition tracking-wider">AGENDAR</button>
        <button onclick="tentarAcessarAdmin()" id="btn-admin" class="flex-1 py-3 text-center font-bold text-neutral-500 transition tracking-wider">PAINEL (ADMIN)</button>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full">

        <!-- ABA 1: CLIENTE -->
        <section id="aba-cliente" class="space-y-4">
            <div class="bg-neutral-950 p-5 rounded-none border border-amber-500/40 shadow-2xl relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-600 via-amber-300 to-amber-600"></div>
                
                <h2 class="text-base font-bold mb-4 text-amber-400 tracking-wide uppercase">>> Novo Agendamento</h2>
                
                <form id="form-agendamento" onsubmit="realizarAgendamento(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-amber-200/80 mb-1 uppercase tracking-wider">Seu Nome</label>
                        <input type="text" id="nome" required class="w-full bg-black border border-amber-500/40 rounded-none p-2.5 text-white focus:outline-none focus:border-amber-400 placeholder:text-neutral-700" placeholder="Ex: João Silva">
                    </div>

                    <div>
                        <label class="block text-xs text-amber-200/80 mb-1 uppercase tracking-wider">Seu WhatsApp</label>
                        <input type="tel" id="telefone" required class="w-full bg-black border border-amber-500/40 rounded-none p-2.5 text-white focus:outline-none focus:border-amber-400 placeholder:text-neutral-700" placeholder="Ex: 12999999999">
                    </div>

                    <div>
                        <label class="block text-xs text-amber-200/80 mb-1 uppercase tracking-wider">Serviço Desejado</label>
                        <select id="servico" required class="w-full bg-black border border-amber-500/40 rounded-none p-2.5 text-white focus:outline-none focus:border-amber-400">
                            <option value="">Selecione o serviço</option>
                            <option value="Corte">Corte</option>
                            <option value="Barba">Barba</option>
                            <option value="Corte + Barba">Corte + Barba</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs text-amber-200/80 mb-1 uppercase tracking-wider">Data Desejada</label>
                        <input type="date" id="data" required onchange="atualizarHorariosDisponiveis()" class="w-full bg-black border border-amber-500/40 rounded-none p-2.5 text-white focus:outline-none focus:border-amber-400">
                    </div>

                    <div>
                        <label class="block text-xs text-amber-200/80 mb-1 uppercase tracking-wider">Horário Desejado</label>
                        <select id="horario" required onchange="atualizarStatusVagas()" class="w-full bg-black border border-amber-500/40 rounded-none p-2.5 text-white focus:outline-none focus:border-amber-400">
                            <option value="">Selecione primeiro a data</option>
                        </select>
                    </div>

                    <div class="bg-black p-3 border border-amber-500/20">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-neutral-300">STATUS DO HORÁRIO:</span>
                            <span id="status-vagas" class="px-2 py-1 bg-neutral-900 text-neutral-400 border border-neutral-800 font-bold">Aguardando data</span>
                        </div>
                    </div>

                    <button type="submit" id="btn-enviar" disabled class="w-full bg-amber-500 hover:bg-amber-400 disabled:bg-neutral-900 disabled:text-neutral-600 disabled:border-neutral-800 text-black font-bold py-3 transition tracking-wider uppercase border border-amber-400">
                        Confirmar Agendamento
                    </button>
                </form>
            </div>
        </section>

        <!-- ABA 2: PAINEL ADMIN -->
        <section id="aba-admin" class="hidden space-y-4">
            <div class="bg-neutral-950 p-5 rounded-none border border-amber-500/40 shadow-2xl relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-600 via-amber-300 to-amber-600"></div>
                
                <h2 class="text-base font-bold mb-4 text-amber-400 tracking-wide uppercase">>> Painel Administrativo</h2>
                
                <!-- Filtro por Data -->
                <div class="mb-4">
                    <label class="block text-xs text-amber-200/80 mb-1 uppercase tracking-wider">Filtrar por Data</label>
                    <input type="date" id="filtro-data-admin" onchange="renderizarPainelAdmin()" class="w-full bg-black border border-amber-500/40 rounded-none p-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>

                <div id="lista-agendamentos" class="space-y-3 text-sm text-neutral-300">
                    <p class="text-neutral-600 text-center py-6">Selecione uma data acima para ver os agendamentos.</p>
                </div>
            </div>
        </section>

    </main>

    <footer class="text-center py-3 text-[10px] text-neutral-600 border-t border-neutral-900 tracking-widest">
        BARBERFLOW SYSTEM &copy; 2026
    </footer>

    <script>
        const SENHA_ADMIN = "1234"; // 🔑 Altere aqui a sua senha se desejar
        const HORARIOS_PADRAO = ["10:00", "11:00", "12:00", "13:00", "14:00", "15:00"];

        function carregarBanco() {
            return JSON.parse(localStorage.getItem('barberflow_db')) || [];
        }

        function salvarBanco(dados) {
            localStorage.setItem('barberflow_db', JSON.stringify(dados));
        }

        function tentarAcessarAdmin() {
            const senhaDigitada = prompt("Digite a senha do Administrador:");
            if (senhaDigitada === SENHA_ADMIN) {
                mudarAba('admin');
            } else if (senhaDigitada !== null) {
                alert("Senha incorreta!");
            }
        }

        function mudarAba(aba) {
            const isCliente = aba === 'cliente';
            document.getElementById('aba-cliente').classList.toggle('hidden', !isCliente);
            document.getElementById('aba-admin').classList.toggle('hidden', isCliente);
            
            document.getElementById('btn-cliente').className = isCliente ? 'flex-1 py-3 text-center font-bold text-amber-400 border-b-2 border-amber-400 transition tracking-wider' : 'flex-1 py-3 text-center font-bold text-neutral-600 transition tracking-wider';
            document.getElementById('btn-admin').className = !isCliente ? 'flex-1 py-3 text-center font-bold text-amber-400 border-b-2 border-amber-400 transition tracking-wider' : 'flex-1 py-3 text-center font-bold text-neutral-600 transition tracking-wider';

            if (!isCliente) {
                // Define a data de hoje por padrão no filtro admin se estiver vazio
                const inputFiltro = document.getElementById('filtro-data-admin');
                if (!inputFiltro.value) {
                    const hoje = new Date().toISOString().split('T')[0];
                    inputFiltro.value = hoje;
                }
                renderizarPainelAdmin();
            }
        }

        function atualizarHorariosDisponiveis() {
            const dataSelecionada = document.getElementById('data').value;
            const selectHorario = document.getElementById('horario');
            const statusBadge = document.getElementById('status-vagas');
            const btnEnviar = document.getElementById('btn-enviar');

            selectHorario.innerHTML = '<option value="">Selecione o horário</option>';
            statusBadge.textContent = "Selecione um horário";
            statusBadge.className = "px-2 py-1 bg-neutral-900 text-neutral-400 border border-neutral-800 font-bold";
            btnEnviar.disabled = true;

            if (!dataSelecionada) {
                selectHorario.innerHTML = '<option value="">Selecione primeiro a data</option>';
                statusBadge.textContent = "Aguardando data";
                return;
            }

            const db = carregarBanco();
            let horariosDisponiveisEncontrados = false;

            HORARIOS_PADRAO.forEach(horario => {
                const jaAgendado = db.some(item => item.data === dataSelecionada && item.horario === horario);

                if (!jaAgendado) {
                    horariosDisponiveisEncontrados = true;
                    const option = document.createElement('option');
                    option.value = horario;
                    option.textContent = `${horario} (Disponível)`;
                    selectHorario.appendChild(option);
                }
            });

            if (!horariosDisponiveisEncontrados) {
                selectHorario.innerHTML = '<option value="">Esgotado para esta data</option>';
                statusBadge.textContent = "TODOS OS HORÁRIOS LOTADOS";
                statusBadge.className = "px-2 py-1 bg-red-950/80 text-red-400 border border-red-900 font-bold";
            }
        }

        function atualizarStatusVagas() {
            const horarioSelecionado = document.getElementById('horario').value;
            const statusBadge = document.getElementById('status-vagas');
            const btnEnviar = document.getElementById('btn-enviar');

            if (!horarioSelecionado) {
                statusBadge.textContent = "Selecione um horário";
                statusBadge.className = "px-2 py-1 bg-neutral-900 text-neutral-400 border border-neutral-800 font-bold";
                btnEnviar.disabled = true;
                return;
            }

            statusBadge.textContent = "HORÁRIO DISPONÍVEL";
            statusBadge.className = "px-2 py-1 bg-amber-950/60 text-amber-400 border border-amber-900/50 font-bold";
            btnEnviar.disabled = false;
        }

        function realizarAgendamento(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            const servico = document.getElementById('servico').value;
            const data = document.getElementById('data').value;
            const horario = document.getElementById('horario').value;

            let db = carregarBanco();
            const jaAgendado = db.some(item => item.data === data && item.horario === horario);

            if (jaAgendado) {
                alert("Infelizmente este horário acabou de ser ocupado por outro cliente!");
                atualizarHorariosDisponiveis();
                return;
            }

            const novoAgendamento = { id: Date.now(), nome, telefone, servico, data, horario };
            db.push(novoAgendamento);
            salvarBanco(db);

            const meuWhatsApp = "5512991421077";
            const mensagem = `Novo Agendamento! 💈%0A*Cliente:* ${encodeURIComponent(nome)}%0A*Tel:* ${encodeURIComponent(telefone)}%0A*Serviço:* ${encodeURIComponent(servico)}%0A*Data:* ${data}%0A*Horário:* ${horario}`;
            
            window.open(`https://api.whatsapp.com/send?phone=${meuWhatsApp}&text=${mensagem}`, '_blank');

            alert("Agendamento realizado com sucesso!");
            document.getElementById('form-agendamento').reset();
            document.getElementById('horario').innerHTML = '<option value="">Selecione primeiro a data</option>';
            document.getElementById('status-vagas').textContent = "Aguardando data";
            document.getElementById('btn-enviar').disabled = true;
        }

        function renderizarPainelAdmin() {
            const db = carregarBanco();
            const dataFiltro = document.getElementById('filtro-data-admin').value;
            const container = document.getElementById('lista-agendamentos');

            if (!dataFiltro) {
                container.innerHTML = `<p class="text-neutral-600 text-center py-6 tracking-wide">Selecione uma data para visualizar.</p>`;
                return;
            }

            // Filtra os agendamentos apenas para a data selecionada no admin
            const agendamentosDoDia = db.filter(item => item.data === dataFiltro);

            if (agendamentosDoDia.length === 0) {
                container.innerHTML = `<p class="text-neutral-500 text-center py-6 tracking-wide">Nenhum agendamento para esta data.</p>`;
                return;
            }

            // Ordena por horário (do mais cedo para o mais tarde)
            agendamentosDoDia.sort((a, b) => a.horario.localeCompare(b.horario));

            container.innerHTML = agendamentosDoDia.map(item => `
                <div class="bg-black p-3 border border-amber-500/20 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-amber-300 tracking-wider">⏰ ${item.horario} - ${item.nome}</p>
                        <p class="text-xs text-neutral-400 mt-0.5">Serviço: ${item.servico || 'Corte'}</p>
                        <p class="text-xs text-neutral-500 mt-0.5">TEL: ${item.telefone}</p>
                    </div>
                    <button onclick="excluirAgendamento(${item.id})" class="text-red-400 hover:text-red-300 text-xs bg-red-950/40 px-2.5 py-1.5 border border-red-900/50 uppercase tracking-wider">Cancelar</button>
                </div>
            `).join('');
        }

        function excluirAgendamento(id) {
            if (confirm("Deseja realmente cancelar este agendamento e liberar o horário?")) {
                let db = carregarBanco();
                db = db.filter(item => item.id !== id);
                salvarBanco(db);
                renderizarPainelAdmin();
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW falhou:', err));
        }
    </script>
</body>
</html>
